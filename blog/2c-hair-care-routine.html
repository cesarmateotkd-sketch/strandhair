            "@type": "Answer",
            "text": "2C hair is the tightest wavy type: S-shaped waves that often start near the root rather than mid-length, and can form loose spirals at the ends. It sits on the border with 3A, and many heads have both. Curl typing is a visual guide; trained raters often disagree. 2C hair is usually prone to frizz in humidity, so most 2C routines use a gel for hold."

          "@type": "Question",
          "name": "Should 2C hair use gel or mousse?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Both, ideally used together. The most effective technique for 2C hair is layering a lightweight curl cream or leave-in first, followed by a medium-hold gel for definition and frizz control, then scrunching mousse on top for volume and bounce. The gel provides the hold and definition; the mousse prevents the gel from creating too stiff a cast and adds the lightweight texture that keeps 2C waves from looking weighed down. Apply all products to soaking wet hair, in that order, and do not touch the hair until it is fully dry."
          }
        },
        {
          "@type": "Question",
          "name": "Why does my 2C hair look straight after it dries?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "2C waves dropping to straight after drying is almost always caused by one of four things: touching or raking the hair while it dries (which breaks the wave clumps), using products too heavy for your hair's density, not applying products to soaking wet hair, or skipping the plopping step that helps form the wave pattern before the hair dries. The fix: apply products to dripping wet hair, plop for 20 minutes, then either diffuse on low heat or air dry completely without touching."
          }
        },
        {
          "@type": "Question",
          "name": "Can 2C hair do the curly girl method?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — the curly girl method works very well for 2C hair. The core CGM principles (no sulfates, no silicones, no heat, gentle cleansing, gel styling) align directly with what 2C hair needs. However, 2C wavy hair often requires a modified approach: many 2C wavies need a clarifying sulfate shampoo occasionally (once every 2–4 weeks) to reset product buildup, and may not need to be fully silicone-free if they use a clarifying wash regularly. The no-heat rule is also often relaxed for 2C — diffusing on low is considered acceptable and helps form waves."
