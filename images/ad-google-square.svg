<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <style>
      .f-serif { font-family: Georgia, 'Times New Roman', serif; }
      .f-sans  { font-family: system-ui, -apple-system, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#3D2B1F"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#C4945A"/>

  <!-- Eyebrow -->
  <text x="600" y="100" class="f-sans" font-size="18" fill="#C4945A" text-anchor="middle" letter-spacing="6">FREE HAIR TYPE QUIZ</text>

  <!-- Headline -->
  <text x="600" y="220" class="f-serif" font-size="96" fill="#FAF7F2" font-weight="700" text-anchor="middle">Find Your</text>
  <text x="600" y="328" class="f-serif" font-size="96" fill="#FAF7F2" font-weight="700" text-anchor="middle">Exact Hair</text>
  <text x="600" y="436" class="f-serif" font-size="96" fill="#C4945A" font-style="italic" text-anchor="middle">Type.</text>

  <line x1="100" y1="476" x2="1100" y2="476" stroke="rgba(196,148,90,0.25)" stroke-width="1"/>

  <!-- Type chips row -->
  <rect x="100" y="504" width="220" height="140" fill="rgba(196,148,90,0.1)" rx="4"/>
  <text x="210" y="578" class="f-serif" font-size="52" fill="#FAF7F2" text-anchor="middle" font-weight="700">1A–2C</text>
  <text x="210" y="614" class="f-sans" font-size="18" fill="rgba(196,148,90,0.8)" text-anchor="middle">Straight &amp; Wavy</text>

  <rect x="340" y="504" width="220" height="140" fill="rgba(196,148,90,0.1)" rx="4"/>
  <text x="450" y="578" class="f-serif" font-size="52" fill="#FAF7F2" text-anchor="middle" font-weight="700">3A–3C</text>
  <text x="450" y="614" class="f-sans" font-size="18" fill="rgba(196,148,90,0.8)" text-anchor="middle">Curly</text>

  <rect x="580" y="504" width="220" height="140" fill="rgba(196,148,90,0.1)" rx="4"/>
  <text x="690" y="578" class="f-serif" font-size="52" fill="#FAF7F2" text-anchor="middle" font-weight="700">4A–4C</text>
  <text x="690" y="614" class="f-sans" font-size="18" fill="rgba(196,148,90,0.8)" text-anchor="middle">Coily</text>

  <rect x="820" y="504" width="280" height="140" fill="#C4945A" rx="4"/>
  <text x="960" y="568" class="f-serif" font-size="28" fill="#FAF7F2" text-anchor="middle" font-weight="700">All 12 Types</text>
  <text x="960" y="604" class="f-sans" font-size="16" fill="rgba(250,247,242,0.8)" text-anchor="middle">Covered</text>

  <!-- Features -->
  <rect x="100" y="672" width="1000" height="240" fill="rgba(0,0,0,0.2)" rx="4"/>
  <text x="600" y="714" class="f-sans" font-size="15" fill="rgba(250,247,242,0.4)" text-anchor="middle" letter-spacing="2">WHAT YOU GET</text>
  <text x="300" y="762" class="f-sans" font-size="20" fill="#FAF7F2" text-anchor="middle">Curl pattern ID</text>
  <text x="300" y="794" class="f-sans" font-size="20" fill="#FAF7F2" text-anchor="middle">Porosity type</text>
  <text x="600" y="762" class="f-sans" font-size="20" fill="#FAF7F2" text-anchor="middle">Full routine</text>
  <text x="600" y="794" class="f-sans" font-size="20" fill="#FAF7F2" text-anchor="middle">Product picks</text>
  <text x="900" y="762" class="f-sans" font-size="20" fill="#FAF7F2" text-anchor="middle">Video tutorials</text>
  <text x="900" y="794" class="f-sans" font-size="20" fill="#FAF7F2" text-anchor="middle">Styling tips</text>
  <line x1="450" y1="740" x2="450" y2="820" stroke="rgba(196,148,90,0.2)" stroke-width="1"/>
  <line x1="750" y1="740" x2="750" y2="820" stroke="rgba(196,148,90,0.2)" stroke-width="1"/>
  <text x="600" y="876" class="f-sans" font-size="16" fill="rgba(250,247,242,0.35)" text-anchor="middle">Takes 30 seconds  ·  Completely free</text>

  <!-- CTA -->
  <rect x="300" y="940" width="600" height="80" fill="#C4945A"/>
  <text x="600" y="990" class="f-serif" font-size="32" fill="#FAF7F2" text-anchor="middle" font-weight="700">Take the Quiz →</text>

  <!-- Footer -->
  <text x="600" y="1120" class="f-serif" font-size="32" fill="rgba(250,247,242,0.2)" text-anchor="middle" letter-spacing="4">str</text>
  <text x="643" y="1120" class="f-serif" font-size="32" fill="rgba(196,148,90,0.45)" font-style="italic" text-anchor="start">a</text>
  <text x="656" y="1120" class="f-serif" font-size="32" fill="rgba(250,247,242,0.2)" letter-spacing="4">nd</text>
  <text x="600" y="1152" class="f-sans" font-size="14" fill="rgba(250,247,242,0.2)" text-anchor="middle" letter-spacing="1">hairtypequiz.hair</text>
</svg>