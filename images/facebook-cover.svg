<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <style>
      .fs { font-family: Georgia, 'Times New Roman', serif; }
      .fn { font-family: system-ui, -apple-system, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1640" height="624" fill="#3D2B1F"/>

  <!-- Subtle texture panels -->
  <rect x="0" y="0" width="360" height="624" fill="rgba(0,0,0,0.2)"/>
  <rect x="1280" y="0" width="360" height="624" fill="rgba(0,0,0,0.2)"/>
  <rect x="360" y="0" width="4" height="624" fill="rgba(196,148,90,0.15)"/>
  <rect x="1276" y="0" width="4" height="624" fill="rgba(196,148,90,0.15)"/>

  <!-- Top + bottom caramel rules -->
  <rect x="0" y="0" width="1640" height="5" fill="#C4945A"/>
  <rect x="0" y="619" width="1640" height="5" fill="#C4945A"/>

  <!-- Left side — hair type chips -->
  <text x="180" y="120" class="fn" font-size="13" fill="rgba(196,148,90,0.5)" text-anchor="middle" letter-spacing="3">EVERY TYPE</text>
  <rect x="80" y="138" width="80" height="80" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="120" y="188" class="fs" font-size="28" fill="#FAF7F2" text-anchor="middle" font-weight="700">1A</text>
  <rect x="172" y="138" width="80" height="80" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="212" y="188" class="fs" font-size="28" fill="#FAF7F2" text-anchor="middle" font-weight="700">2B</text>
  <rect x="80" y="230" width="80" height="80" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="120" y="280" class="fs" font-size="28" fill="#FAF7F2" text-anchor="middle" font-weight="700">3C</text>
  <rect x="172" y="230" width="80" height="80" fill="#C4945A" rx="2"/>
  <text x="212" y="280" class="fs" font-size="28" fill="#FAF7F2" text-anchor="middle" font-weight="700">4C</text>
  <text x="180" y="370" class="fn" font-size="12" fill="rgba(250,247,242,0.3)" text-anchor="middle">1A through 4C</text>

  <!-- Center — main brand content (safe zone 560-1080) -->
  <text x="820" y="148" class="fn" font-size="15" fill="#C4945A" text-anchor="middle" letter-spacing="6">FREE HAIR QUIZ</text>

  <!-- Logo -->
  <text x="820" y="286" class="fs" font-size="124" fill="#FAF7F2" font-weight="300" text-anchor="middle" letter-spacing="12">str</text>
  <text x="975" y="286" class="fs" font-size="124" fill="#C4945A" font-style="italic" text-anchor="middle">a</text>
  <text x="1020" y="286" class="fs" font-size="124" fill="#FAF7F2" font-weight="300" text-anchor="middle" letter-spacing="12">nd</text>

  <line x1="520" y1="316" x2="1120" y2="316" stroke="rgba(196,148,90,0.3)" stroke-width="1"/>

  <text x="820" y="364" class="fn" font-size="19" fill="rgba(250,247,242,0.55)" text-anchor="middle">Find your hair type. Build your routine.</text>
  <text x="820" y="394" class="fn" font-size="17" fill="rgba(250,247,242,0.35)" text-anchor="middle">hairtypequiz.hair</text>

  <!-- CTA pill -->
  <rect x="660" y="428" width="320" height="52" fill="#C4945A" rx="26"/>
  <text x="820" y="461" class="fn" font-size="16" fill="#FAF7F2" font-weight="500" text-anchor="middle" letter-spacing="1">Take the Free Quiz</text>

  <!-- Right side — feature list -->
  <text x="1460" y="120" class="fn" font-size="13" fill="rgba(196,148,90,0.5)" text-anchor="middle" letter-spacing="3">INCLUDES</text>
  <text x="1310" y="180" class="fn" font-size="16" fill="rgba(250,247,242,0.6)">Curl pattern ID</text>
  <text x="1310" y="212" class="fn" font-size="16" fill="rgba(250,247,242,0.6)">Porosity type</text>
  <text x="1310" y="244" class="fn" font-size="16" fill="rgba(250,247,242,0.6)">Personalized routine</text>
  <text x="1310" y="276" class="fn" font-size="16" fill="rgba(250,247,242,0.6)">Product picks</text>
  <text x="1310" y="308" class="fn" font-size="16" fill="rgba(250,247,242,0.6)">Tutorial videos</text>
  <line x1="1295" y1="330" x2="1610" y2="330" stroke="rgba(196,148,90,0.2)" stroke-width="1"/>
  <text x="1460" y="362" class="fn" font-size="13" fill="rgba(250,247,242,0.25)" text-anchor="middle">Takes 30 seconds</text>
  <text x="1460" y="384" class="fn" font-size="13" fill="rgba(250,247,242,0.25)" text-anchor="middle">Completely free</text>

</svg>