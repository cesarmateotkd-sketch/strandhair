<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <style>
      .fs { font-family: Georgia, 'Times New Roman', serif; }
      .fn { font-family: system-ui, -apple-system, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1640" height="624" fill="#2A1A0E"/>

  <!-- Strong caramel left bar -->
  <rect x="0" y="0" width="12" height="624" fill="#C4945A"/>

  <!-- Caramel diagonal accent -->
  <polygon points="0,0 420,0 320,624 0,624" fill="rgba(196,148,90,0.07)"/>

  <!-- Top rule -->
  <rect x="12" y="0" width="1628" height="4" fill="rgba(196,148,90,0.3)"/>
  <!-- Bottom rule -->
  <rect x="12" y="620" width="1628" height="4" fill="rgba(196,148,90,0.3)"/>

  <!-- LEFT BLOCK — bold question -->
  <text x="72" y="178" class="fn" font-size="13" fill="#C4945A" letter-spacing="5">TAKE THE FREE QUIZ</text>
  <text x="68" y="290" class="fs" font-size="96" fill="#FAF7F2" font-weight="700">What&apos;s your</text>
  <text x="68" y="400" class="fs" font-size="96" fill="#C4945A" font-style="italic" font-weight="700">hair type?</text>
  <text x="68" y="452" class="fn" font-size="18" fill="rgba(250,247,242,0.45)">1A through 4C — find yours in 30 seconds</text>

  <!-- CTA button -->
  <rect x="68" y="490" width="280" height="58" fill="#C4945A"/>
  <text x="208" y="527" class="fn" font-size="17" fill="#FAF7F2" font-weight="600" text-anchor="middle" letter-spacing="1">hairtypequiz.hair</text>

  <!-- CENTER DIVIDER -->
  <line x1="820" y1="60" x2="820" y2="564" stroke="rgba(196,148,90,0.15)" stroke-width="1"/>

  <!-- RIGHT BLOCK — brand + features -->
  <!-- Logo — single text element, tspan for the caramel italic a -->
  <text x="1230" y="240" class="fs" font-size="86" fill="#FAF7F2" font-weight="300" text-anchor="middle" letter-spacing="8">str<tspan fill="#C4945A" font-style="italic" letter-spacing="0">a</tspan><tspan letter-spacing="8">nd</tspan></text>

  <line x1="900" y1="268" x2="1560" y2="268" stroke="rgba(196,148,90,0.25)" stroke-width="1"/>

  <text x="1230" y="316" class="fn" font-size="16" fill="rgba(250,247,242,0.45)" text-anchor="middle" letter-spacing="1">YOUR PERSONALIZED HAIR ROUTINE</text>

  <!-- Feature chips -->
  <rect x="900" y="340" width="195" height="52" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="997" y="372" class="fn" font-size="14" fill="rgba(250,247,242,0.7)" text-anchor="middle">Curl Pattern ID</text>

  <rect x="1107" y="340" width="195" height="52" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="1204" y="372" class="fn" font-size="14" fill="rgba(250,247,242,0.7)" text-anchor="middle">Porosity Type</text>

  <rect x="1314" y="340" width="246" height="52" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="1437" y="372" class="fn" font-size="14" fill="rgba(250,247,242,0.7)" text-anchor="middle">Product Routine</text>

  <rect x="900" y="404" width="195" height="52" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="997" y="436" class="fn" font-size="14" fill="rgba(250,247,242,0.7)" text-anchor="middle">Top-Rated Picks</text>

  <rect x="1107" y="404" width="195" height="52" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="1204" y="436" class="fn" font-size="14" fill="rgba(250,247,242,0.7)" text-anchor="middle">Tutorial Videos</text>

  <rect x="1314" y="404" width="246" height="52" fill="rgba(196,148,90,0.1)" rx="2"/>
  <text x="1437" y="436" class="fn" font-size="14" fill="rgba(250,247,242,0.7)" text-anchor="middle">Completely Free</text>

  <text x="1230" y="530" class="fn" font-size="13" fill="rgba(250,247,242,0.2)" text-anchor="middle" letter-spacing="2">ALL 12 HAIR TYPES  ·  1A TO 4C</text>

</svg>