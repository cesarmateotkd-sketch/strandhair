<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <style>
      .f-serif { font-family: Georgia, 'Times New Roman', serif; }
      .f-sans  { font-family: system-ui, -apple-system, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="1500" fill="#FAF7F2"/>

  <!-- Header -->
  <rect width="1000" height="300" fill="#3D2B1F"/>
  <text x="500" y="92" class="f-sans" font-size="20" fill="#C4945A" text-anchor="middle" letter-spacing="6">WAVY HAIR · BEGINNER'S GUIDE</text>
  <text x="500" y="188" class="f-serif" font-size="72" fill="#FAF7F2" text-anchor="middle" font-weight="700">The Curly Girl</text>
  <text x="500" y="264" class="f-serif" font-size="66" fill="#C4945A" text-anchor="middle" font-style="italic">Method for Waves</text>

  <!-- Subtypes bar -->
  <rect width="1000" height="64" y="300" fill="#E8DDD0"/>
  <text x="500" y="341" class="f-sans" font-size="22" fill="#8B6F5E" text-anchor="middle" letter-spacing="3">TYPES 2A  ·  2B  ·  2C</text>

  <!-- Step rows -->
  <!-- Step 1 -->
  <rect x="0" y="384" width="1000" height="176" fill="#FAF7F2"/>
  <rect x="0" y="384" width="10" height="176" fill="#C4945A"/>
  <text x="60" y="440" class="f-serif" font-size="52" fill="#3D2B1F" font-weight="700">No Sulfates</text>
  <text x="60" y="488" class="f-sans" font-size="22" fill="#8B6F5E">Switch to a sulfate-free or co-wash shampoo</text>
  <text x="60" y="528" class="f-sans" font-size="19" fill="#8B6F5E" opacity="0.6">Sulfates strip the natural oils wavies need</text>
  <line x1="0" y1="560" x2="1000" y2="560" stroke="#E8DDD0" stroke-width="2"/>

  <!-- Step 2 -->
  <rect x="0" y="560" width="1000" height="176" fill="#F5F0E8"/>
  <rect x="0" y="560" width="10" height="176" fill="#3D2B1F"/>
  <text x="60" y="616" class="f-serif" font-size="52" fill="#3D2B1F" font-weight="700">No Silicones</text>
  <text x="60" y="664" class="f-sans" font-size="22" fill="#8B6F5E">Avoid ingredients ending in -cone, -xane, -conol</text>
  <text x="60" y="704" class="f-sans" font-size="19" fill="#8B6F5E" opacity="0.6">Silicones coat the strand — blocks moisture</text>
  <line x1="0" y1="736" x2="1000" y2="736" stroke="#E8DDD0" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="0" y="736" width="1000" height="176" fill="#FAF7F2"/>
  <rect x="0" y="736" width="10" height="176" fill="#C4945A"/>
  <text x="60" y="792" class="f-serif" font-size="52" fill="#3D2B1F" font-weight="700">Scrunch, Don't Rub</text>
  <text x="60" y="840" class="f-sans" font-size="22" fill="#8B6F5E">Apply products scrunching upward toward roots</text>
  <text x="60" y="880" class="f-sans" font-size="19" fill="#8B6F5E" opacity="0.6">Rubbing destroys the wave pattern</text>
  <line x1="0" y1="912" x2="1000" y2="912" stroke="#E8DDD0" stroke-width="2"/>

  <!-- Step 4 -->
  <rect x="0" y="912" width="1000" height="176" fill="#F5F0E8"/>
  <rect x="0" y="912" width="10" height="176" fill="#3D2B1F"/>
  <text x="60" y="968" class="f-serif" font-size="52" fill="#3D2B1F" font-weight="700">Diffuse or Air Dry</text>
  <text x="60" y="1016" class="f-sans" font-size="22" fill="#8B6F5E">Never rough-dry with a towel or blow-dry</text>
  <text x="60" y="1056" class="f-sans" font-size="19" fill="#8B6F5E" opacity="0.6">Heat + friction = frizz and lost definition</text>
  <line x1="0" y1="1088" x2="1000" y2="1088" stroke="#E8DDD0" stroke-width="2"/>

  <!-- Step 5 -->
  <rect x="0" y="1088" width="1000" height="176" fill="#FAF7F2"/>
  <rect x="0" y="1088" width="10" height="176" fill="#C4945A"/>
  <text x="60" y="1144" class="f-serif" font-size="52" fill="#3D2B1F" font-weight="700">The Gel Cast</text>
  <text x="60" y="1192" class="f-sans" font-size="22" fill="#8B6F5E">Apply gel, let dry stiff — then scrunch out</text>
  <text x="60" y="1232" class="f-sans" font-size="19" fill="#8B6F5E" opacity="0.6">The "crunch" becomes soft, defined waves</text>

  <!-- CTA -->
  <rect x="0" y="1296" width="1000" height="148" fill="#C4945A"/>
  <text x="500" y="1362" class="f-serif" font-size="40" fill="#FAF7F2" text-anchor="middle" font-weight="700">Find your wave type + full routine</text>
  <text x="500" y="1410" class="f-sans" font-size="26" fill="rgba(250,247,242,0.85)" text-anchor="middle">hairtypequiz.hair — free quiz</text>

  <!-- Footer -->
  <rect x="0" y="1444" width="1000" height="56" fill="#3D2B1F"/>
  <text x="500" y="1480" class="f-serif" font-size="24" fill="rgba(250,247,242,0.6)" text-anchor="middle" letter-spacing="3">str<tspan fill="#C4945A" font-style="italic">a</tspan>nd  ·  hairtypequiz.hair</text>
</svg>
