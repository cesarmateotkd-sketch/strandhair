<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <style>
      .f-serif { font-family: Georgia, 'Times New Roman', serif; }
      .f-sans  { font-family: system-ui, -apple-system, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="1500" fill="#1F1A2E"/>

  <!-- Header -->
  <text x="500" y="106" class="f-sans" font-size="20" fill="#C4945A" text-anchor="middle" letter-spacing="6">NATURAL HAIR · LENGTH RETENTION</text>
  <text x="500" y="210" class="f-serif" font-size="80" fill="#FAF7F2" text-anchor="middle" font-weight="700">Protective</text>
  <text x="500" y="296" class="f-serif" font-size="72" fill="#C4945A" text-anchor="middle" font-style="italic">Styles Guide</text>
  <text x="500" y="356" class="f-sans" font-size="22" fill="rgba(250,247,242,0.45)" text-anchor="middle">10 styles · duration guide · prep routine</text>
  <line x1="80" y1="394" x2="920" y2="394" stroke="rgba(196,148,90,0.3)" stroke-width="1"/>

  <!-- Style 01 -->
  <rect x="60" y="420" width="880" height="108" fill="rgba(255,255,255,0.05)" rx="4"/>
  <rect x="60" y="420" width="8" height="108" fill="#C4945A" rx="2"/>
  <text x="124" y="484" class="f-serif" font-size="48" fill="rgba(196,148,90,0.25)" font-weight="300">01</text>
  <text x="220" y="462" class="f-serif" font-size="32" fill="#FAF7F2" font-weight="700">Knotless Braids</text>
  <text x="220" y="496" class="f-sans" font-size="19" fill="rgba(250,247,242,0.55)">6–8 weeks · lowest scalp tension · best for thinning edges</text>
  <text x="220" y="518" class="f-sans" font-size="15" fill="rgba(196,148,90,0.6)">Feed-in method eliminates root knot entirely</text>

  <!-- Style 02 -->
  <rect x="60" y="544" width="880" height="108" fill="rgba(255,255,255,0.03)" rx="4"/>
  <rect x="60" y="544" width="8" height="108" fill="#8B6F5E" rx="2"/>
  <text x="124" y="608" class="f-serif" font-size="48" fill="rgba(139,111,94,0.25)" font-weight="300">02</text>
  <text x="220" y="586" class="f-serif" font-size="32" fill="#FAF7F2" font-weight="700">Box Braids</text>
  <text x="220" y="620" class="f-sans" font-size="19" fill="rgba(250,247,242,0.55)">4–6 weeks · max 8 · the classic length-retention style</text>
  <text x="220" y="642" class="f-sans" font-size="15" fill="rgba(139,111,94,0.6)">Versatile — worn up, down, bun, or half-up</text>

  <!-- Style 03 -->
  <rect x="60" y="668" width="880" height="108" fill="rgba(255,255,255,0.05)" rx="4"/>
  <rect x="60" y="668" width="8" height="108" fill="#C4945A" rx="2"/>
  <text x="124" y="732" class="f-serif" font-size="48" fill="rgba(196,148,90,0.25)" font-weight="300">03</text>
  <text x="220" y="710" class="f-serif" font-size="32" fill="#FAF7F2" font-weight="700">Two-Strand Twists</text>
  <text x="220" y="744" class="f-sans" font-size="19" fill="rgba(250,247,242,0.55)">2–4 weeks · DIY-friendly · perfect for 4C coils</text>
  <text x="220" y="766" class="f-sans" font-size="15" fill="rgba(196,148,90,0.6)">Unravel for defined twist-out curls</text>

  <!-- Style 04 -->
  <rect x="60" y="792" width="880" height="108" fill="rgba(255,255,255,0.03)" rx="4"/>
  <rect x="60" y="792" width="8" height="108" fill="#7BB8A0" rx="2"/>
  <text x="124" y="856" class="f-serif" font-size="48" fill="rgba(123,184,160,0.25)" font-weight="300">04</text>
  <text x="220" y="834" class="f-serif" font-size="32" fill="#FAF7F2" font-weight="700">Crochet Styles</text>
  <text x="220" y="868" class="f-sans" font-size="19" fill="rgba(250,247,242,0.55)">6–8 weeks · fastest install · beginner-friendly</text>
  <text x="220" y="890" class="f-sans" font-size="15" fill="rgba(123,184,160,0.6)">Latch hook method — no professional braider needed</text>

  <!-- Style 05 -->
  <rect x="60" y="916" width="880" height="108" fill="rgba(255,255,255,0.05)" rx="4"/>
  <rect x="60" y="916" width="8" height="108" fill="#C4945A" rx="2"/>
  <text x="124" y="980" class="f-serif" font-size="48" fill="rgba(196,148,90,0.25)" font-weight="300">05</text>
  <text x="220" y="958" class="f-serif" font-size="32" fill="#FAF7F2" font-weight="700">Wigs</text>
  <text x="220" y="992" class="f-sans" font-size="19" fill="rgba(250,247,242,0.55)">Maximum protection · zero exposure · endless variety</text>
  <text x="220" y="1014" class="f-sans" font-size="15" fill="rgba(196,148,90,0.6)">Cornrow underneath + satin cap = full protection</text>

  <!-- Rule -->
  <rect x="60" y="1044" width="880" height="80" fill="rgba(196,148,90,0.1)" rx="4"/>
  <text x="500" y="1080" class="f-sans" font-size="20" fill="#C4945A" text-anchor="middle" font-weight="700">Max 8 weeks in any braided style</text>
  <text x="500" y="1108" class="f-sans" font-size="17" fill="rgba(250,247,242,0.45)" text-anchor="middle">Give hair 1–2 weeks free between installs</text>

  <!-- Mistakes -->
  <rect x="60" y="1144" width="880" height="160" fill="rgba(255,255,255,0.03)" rx="4"/>
  <rect x="60" y="1144" width="8" height="160" fill="#C47A7A" rx="2"/>
  <text x="124" y="1178" class="f-serif" font-size="24" fill="#FAF7F2" font-weight="700">Top Mistakes to Avoid</text>
  <text x="124" y="1208" class="f-sans" font-size="18" fill="rgba(250,247,242,0.55)">✗  Installing too tight — pain = damage</text>
  <text x="124" y="1236" class="f-sans" font-size="18" fill="rgba(250,247,242,0.55)">✗  Skipping moisture during wear</text>
  <text x="124" y="1264" class="f-sans" font-size="18" fill="rgba(250,247,242,0.55)">✗  Leaving style in past 8 weeks</text>
  <text x="124" y="1292" class="f-sans" font-size="15" fill="rgba(196,122,122,0.6)">Traction alopecia affects 1 in 3 Black women — don't ignore scalp pain</text>

  <!-- CTA -->
  <rect x="0" y="1340" width="1000" height="92" fill="#C4945A"/>
  <text x="500" y="1396" class="f-serif" font-size="36" fill="#FAF7F2" text-anchor="middle" font-weight="700">Find your personalized hair routine →</text>

  <!-- Footer -->
  <rect x="0" y="1432" width="1000" height="68" fill="rgba(0,0,0,0.3)"/>
  <text x="500" y="1474" class="f-serif" font-size="24" fill="rgba(250,247,242,0.5)" text-anchor="middle" letter-spacing="3">str<tspan fill="#C4945A" font-style="italic">a</tspan>nd  ·  hairtypequiz.hair</text>
</svg>
