<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <style>
      .f-serif { font-family: Georgia, 'Times New Roman', serif; }
      .f-sans  { font-family: system-ui, -apple-system, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1500" fill="#FAF7F2"/>

  <!-- Top espresso block -->
  <rect width="1000" height="520" fill="#3D2B1F"/>

  <!-- Eyebrow label -->
  <text x="500" y="100" class="f-sans" font-size="22" fill="#C4945A" text-anchor="middle" letter-spacing="6" font-weight="400">FREE QUIZ</text>

  <!-- Main headline -->
  <text x="500" y="210" class="f-serif" font-size="88" fill="#FAF7F2" text-anchor="middle" font-weight="700">What's Your</text>
  <text x="500" y="320" class="f-serif" font-size="88" fill="#C4945A" text-anchor="middle" font-weight="700" font-style="italic">Hair Type?</text>

  <!-- Divider line -->
  <line x1="160" y1="368" x2="840" y2="368" stroke="#C4945A" stroke-width="1" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="500" y="420" class="f-sans" font-size="26" fill="rgba(250,247,242,0.7)" text-anchor="middle">1A · 1B · 1C  ·  2A · 2B · 2C</text>
  <text x="500" y="462" class="f-sans" font-size="26" fill="rgba(250,247,242,0.7)" text-anchor="middle">3A · 3B · 3C  ·  4A · 4B · 4C</text>

  <!-- ── Hair type grid (4 rows × 3 cols) ── -->
  <!-- Row labels and colors alternate espresso/sand -->
  <!-- Row 1: 1A 1B 1C -->
  <rect x="60"  y="560" width="260" height="120" fill="#3D2B1F" rx="4"/>
  <rect x="370" y="560" width="260" height="120" fill="#E8DDD0" rx="4"/>
  <rect x="680" y="560" width="260" height="120" fill="#3D2B1F" rx="4"/>
  <text x="190" y="612" class="f-serif" font-size="42" fill="#FAF7F2" text-anchor="middle" font-weight="700">1A</text>
  <text x="190" y="648" class="f-sans"  font-size="18" fill="rgba(250,247,242,0.55)" text-anchor="middle">Pin-straight fine</text>
  <text x="500" y="612" class="f-serif" font-size="42" fill="#3D2B1F" text-anchor="middle" font-weight="700">1B</text>
  <text x="500" y="648" class="f-sans"  font-size="18" fill="#8B6F5E" text-anchor="middle">Straight, slight bend</text>
  <text x="810" y="612" class="f-serif" font-size="42" fill="#FAF7F2" text-anchor="middle" font-weight="700">1C</text>
  <text x="810" y="648" class="f-sans"  font-size="18" fill="rgba(250,247,242,0.55)" text-anchor="middle">Straight, coarse</text>

  <!-- Row 2: 2A 2B 2C -->
  <rect x="60"  y="700" width="260" height="120" fill="#E8DDD0" rx="4"/>
  <rect x="370" y="700" width="260" height="120" fill="#3D2B1F" rx="4"/>
  <rect x="680" y="700" width="260" height="120" fill="#E8DDD0" rx="4"/>
  <text x="190" y="752" class="f-serif" font-size="42" fill="#3D2B1F" text-anchor="middle" font-weight="700">2A</text>
  <text x="190" y="788" class="f-sans"  font-size="18" fill="#8B6F5E" text-anchor="middle">Loose, fine waves</text>
  <text x="500" y="752" class="f-serif" font-size="42" fill="#FAF7F2" text-anchor="middle" font-weight="700">2B</text>
  <text x="500" y="788" class="f-sans"  font-size="18" fill="rgba(250,247,242,0.55)" text-anchor="middle">Defined S-waves</text>
  <text x="810" y="752" class="f-serif" font-size="42" fill="#3D2B1F" text-anchor="middle" font-weight="700">2C</text>
  <text x="810" y="788" class="f-sans"  font-size="18" fill="#8B6F5E" text-anchor="middle">Thick, frizzy waves</text>

  <!-- Row 3: 3A 3B 3C -->
  <rect x="60"  y="840" width="260" height="120" fill="#3D2B1F" rx="4"/>
  <rect x="370" y="840" width="260" height="120" fill="#E8DDD0" rx="4"/>
  <rect x="680" y="840" width="260" height="120" fill="#3D2B1F" rx="4"/>
  <text x="190" y="892" class="f-serif" font-size="42" fill="#FAF7F2" text-anchor="middle" font-weight="700">3A</text>
  <text x="190" y="928" class="f-sans"  font-size="18" fill="rgba(250,247,242,0.55)" text-anchor="middle">Loose springy curls</text>
  <text x="500" y="892" class="f-serif" font-size="42" fill="#3D2B1F" text-anchor="middle" font-weight="700">3B</text>
  <text x="500" y="928" class="f-sans"  font-size="18" fill="#8B6F5E" text-anchor="middle">Defined spiral curls</text>
  <text x="810" y="892" class="f-serif" font-size="42" fill="#FAF7F2" text-anchor="middle" font-weight="700">3C</text>
  <text x="810" y="928" class="f-sans"  font-size="18" fill="rgba(250,247,242,0.55)" text-anchor="middle">Tight corkscrews</text>

  <!-- Row 4: 4A 4B 4C -->
  <rect x="60"  y="980" width="260" height="120" fill="#E8DDD0" rx="4"/>
  <rect x="370" y="980" width="260" height="120" fill="#3D2B1F" rx="4"/>
  <rect x="680" y="980" width="260" height="120" fill="#E8DDD0" rx="4"/>
  <text x="190" y="1032" class="f-serif" font-size="42" fill="#3D2B1F" text-anchor="middle" font-weight="700">4A</text>
  <text x="190" y="1068" class="f-sans"  font-size="18" fill="#8B6F5E" text-anchor="middle">Soft coily S-pattern</text>
  <text x="500" y="1032" class="f-serif" font-size="42" fill="#FAF7F2" text-anchor="middle" font-weight="700">4B</text>
  <text x="500" y="1068" class="f-sans"  font-size="18" fill="rgba(250,247,242,0.55)" text-anchor="middle">Z-pattern coils</text>
  <text x="810" y="1032" class="f-serif" font-size="42" fill="#3D2B1F" text-anchor="middle" font-weight="700">4C</text>
  <text x="810" y="1068" class="f-sans"  font-size="18" fill="#8B6F5E" text-anchor="middle">Tightly kinky coils</text>

  <!-- CTA strip -->
  <rect x="0" y="1148" width="1000" height="200" fill="#C4945A"/>
  <text x="500" y="1232" class="f-serif" font-size="44" fill="#FAF7F2" text-anchor="middle" font-weight="700">Find yours in 30 seconds.</text>
  <text x="500" y="1286" class="f-sans" font-size="26" fill="rgba(250,247,242,0.85)" text-anchor="middle">Get a full personalized product routine →</text>

  <!-- Footer -->
  <rect x="0" y="1400" width="1000" height="100" fill="#3D2B1F"/>
  <text x="500" y="1458" class="f-serif" font-size="28" fill="#FAF7F2" text-anchor="middle" letter-spacing="4">str<tspan fill="#C4945A" font-style="italic">a</tspan>nd  ·  hairtypequiz.hair</text>
</svg>
