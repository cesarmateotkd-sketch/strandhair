<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <style>
      .f-serif { font-family: Georgia, 'Times New Roman', serif; }
      .f-sans  { font-family: system-ui, -apple-system, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="1500" fill="#3D2B1F"/>

  <!-- Header -->
  <text x="500" y="106" class="f-sans" font-size="20" fill="#C4945A" text-anchor="middle" letter-spacing="6">4C NATURAL HAIR · WASH DAY GUIDE</text>
  <text x="500" y="216" class="f-serif" font-size="86" fill="#FAF7F2" text-anchor="middle" font-weight="700">How to Wash</text>
  <text x="500" y="304" class="f-serif" font-size="76" fill="#C4945A" text-anchor="middle" font-style="italic">4C Hair</text>
  <text x="500" y="366" class="f-sans" font-size="22" fill="rgba(250,247,242,0.45)" text-anchor="middle">Without breakage — 5-step wash day routine</text>
  <line x1="80" y1="404" x2="920" y2="404" stroke="rgba(196,148,90,0.3)" stroke-width="1"/>

  <!-- Step 01: Pre-Poo -->
  <rect x="60" y="432" width="880" height="156" fill="rgba(255,255,255,0.05)" rx="4"/>
  <rect x="60" y="432" width="8" height="156" fill="#C4945A" rx="2"/>
  <text x="124" y="522" class="f-serif" font-size="56" fill="rgba(196,148,90,0.3)" font-weight="300">01</text>
  <text x="220" y="492" class="f-serif" font-size="36" fill="#FAF7F2" font-weight="700">Pre-Poo</text>
  <text x="220" y="528" class="f-sans" font-size="21" fill="rgba(250,247,242,0.55)">Protect strands before shampoo strips them</text>
  <text x="220" y="564" class="f-sans" font-size="18" fill="rgba(250,247,242,0.3)">Coconut oil · TGIN Honey Mask · 30 min – overnight</text>

  <!-- Step 02: Detangle -->
  <rect x="60" y="608" width="880" height="156" fill="rgba(255,255,255,0.03)" rx="4"/>
  <rect x="60" y="608" width="8" height="156" fill="#8B6F5E" rx="2"/>
  <text x="124" y="698" class="f-serif" font-size="56" fill="rgba(139,111,94,0.3)" font-weight="300">02</text>
  <text x="220" y="668" class="f-serif" font-size="36" fill="#FAF7F2" font-weight="700">Detangle First</text>
  <text x="220" y="704" class="f-sans" font-size="21" fill="rgba(250,247,242,0.55)">Work in sections · ends to roots · fingers first</text>
  <text x="220" y="740" class="f-sans" font-size="18" fill="rgba(250,247,242,0.3)">Never detangle after shampoo — always before</text>

  <!-- Step 03: Cleanse -->
  <rect x="60" y="784" width="880" height="156" fill="rgba(255,255,255,0.05)" rx="4"/>
  <rect x="60" y="784" width="8" height="156" fill="#C4945A" rx="2"/>
  <text x="124" y="874" class="f-serif" font-size="56" fill="rgba(196,148,90,0.3)" font-weight="300">03</text>
  <text x="220" y="844" class="f-serif" font-size="36" fill="#FAF7F2" font-weight="700">Cleanse</text>
  <text x="220" y="880" class="f-sans" font-size="21" fill="rgba(250,247,242,0.55)">Sulfate-free shampoo every 1–2 weeks</text>
  <text x="220" y="916" class="f-sans" font-size="18" fill="rgba(250,247,242,0.3)">Co-wash for mid-week refreshes · clarify monthly</text>

  <!-- Step 04: Deep Condition -->
  <rect x="60" y="960" width="880" height="156" fill="rgba(255,255,255,0.03)" rx="4"/>
  <rect x="60" y="960" width="8" height="156" fill="#8B6F5E" rx="2"/>
  <text x="124" y="1050" class="f-serif" font-size="56" fill="rgba(139,111,94,0.3)" font-weight="300">04</text>
  <text x="220" y="1020" class="f-serif" font-size="36" fill="#FAF7F2" font-weight="700">Deep Condition</text>
  <text x="220" y="1056" class="f-sans" font-size="21" fill="rgba(250,247,242,0.55)">20–30 min with heat — non-negotiable for 4C</text>
  <text x="220" y="1092" class="f-sans" font-size="18" fill="rgba(250,247,242,0.3)">Manuka honey mask · moisture or protein treatment</text>

  <!-- Step 05: LOC Method -->
  <rect x="60" y="1136" width="880" height="156" fill="rgba(255,255,255,0.05)" rx="4"/>
  <rect x="60" y="1136" width="8" height="156" fill="#C4945A" rx="2"/>
  <text x="124" y="1226" class="f-serif" font-size="56" fill="rgba(196,148,90,0.3)" font-weight="300">05</text>
  <text x="220" y="1196" class="f-serif" font-size="36" fill="#FAF7F2" font-weight="700">LOC Method</text>
  <text x="220" y="1232" class="f-sans" font-size="21" fill="rgba(250,247,242,0.55)">Liquid → Oil → Cream while hair is still damp</text>
  <text x="220" y="1268" class="f-sans" font-size="18" fill="rgba(250,247,242,0.3)">Seal in moisture so it lasts 3+ days</text>

  <!-- CTA -->
  <rect x="0" y="1340" width="1000" height="92" fill="#C4945A"/>
  <text x="500" y="1396" class="f-serif" font-size="36" fill="#FAF7F2" text-anchor="middle" font-weight="700">Find your personalized 4C routine →</text>

  <!-- Footer -->
  <rect x="0" y="1432" width="1000" height="68" fill="rgba(0,0,0,0.3)"/>
  <text x="500" y="1474" class="f-serif" font-size="24" fill="rgba(250,247,242,0.5)" text-anchor="middle" letter-spacing="3">str<tspan fill="#C4945A" font-style="italic">a</tspan>nd  ·  hairtypequiz.hair</text>
</svg>
